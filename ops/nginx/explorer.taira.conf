# Taira Explorer serves the application only. Browser requests go directly to
# https://taira.sora.org using the deployment's required runtime configuration.
server {
  listen 443 ssl;
  http2 on;
  server_name taira-explorer.sora.org;

  ssl_certificate     /opt/homebrew/var/letsencrypt/config/live/taira.sora.org/fullchain.pem;
  ssl_certificate_key /opt/homebrew/var/letsencrypt/config/live/taira.sora.org/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  root /Users/administrator/dev/iroha2-block-explorer-web/dist;
  index index.html;
  add_header Cache-Control "no-cache";

  gzip on;
  gzip_comp_level 6;
  gzip_types application/wasm application/javascript text/css;
  gzip_vary on;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
